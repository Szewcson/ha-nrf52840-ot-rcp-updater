name: nRF52840 OT RCP Updater
version: 0.1.0
slug: nrf52840_ot_rcp_updater
description: Safely updates a PCA10059 OpenThread RCP used by the official OTBR app
url: https://github.com/example/ha-nrf52840-ot-rcp-updater
arch:
  - aarch64
  - amd64
startup: services
init: false
hassio_api: true
hassio_role: default
usb: true
services:
  - mqtt:need
options:
  device: null
  baudrate: 1000000
  hardware: PCA10059
  otbr_addon_slug: core_openthread_border_router
  otbr_api_url: null
  safe_update: true
  allow_legacy_rcp: false
  dfu_serial_number: null
  manifest_url: null
  manifest_poll_interval: 3600
  idle_window: 20
  boot_timeout: 45
schema:
  device: device(subsystem=tty)
  baudrate: list(115200|230400|460800|921600|1000000)
  hardware: list(PCA10059)
  otbr_addon_slug: str
  otbr_api_url: url?
  safe_update: bool
  allow_legacy_rcp: bool
  dfu_serial_number: str?
  manifest_url: url?
  manifest_poll_interval: int(300,86400)
  idle_window: int(10,300)
  boot_timeout: int(15,120)
