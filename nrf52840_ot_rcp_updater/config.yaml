name: PCA10059 OpenThread RCP Updater
version: 0.4.1
slug: nrf52840_ot_rcp_updater
description: Safely updates a PCA10059 RCP used by the Home Assistant Core OpenThread Border Router app
stage: experimental
url: https://github.com/Szewcson/ha-nrf52840-ot-rcp-updater
arch:
  - aarch64
  - amd64
startup: services
init: false
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8099
# Keep requests length-delimited through the Home Assistant Ingress proxy.
# The app accepts bounded 4 MiB manual artifacts, so streaming is unnecessary.
ingress_stream: false
panel_icon: mdi:chip
panel_title: PCA10059 RCP
panel_admin: true
# Keep the custom profile explicit: it is worth one Supervisor rating point
# only after the profile has been loaded on the host.
apparmor: true
# Secure DFU uses the selected CDC ACM serial endpoint, not raw USB transfers.
uart: true
tmpfs: true
services:
  - mqtt:need
options:
  device: null
  baudrate: "1000000"
  safe_update: true
  qemu_usb_reenumeration_workaround: false
  allow_legacy_rcp: false
  allow_prereleases: false
  pinned_ncs_minor: ""
  dfu_serial_number: ""
  dfu_usb_path: ""
  manifest_poll_interval: 3600
  idle_window: 20
  boot_timeout: 90
schema:
  # Select the normal RCP endpoint before starting any Secure DFU recovery.
  device: device(subsystem=tty)
  # Match the Core OpenThread Border Router selector while keeping values fixed.
  baudrate: list(57600|115200|230400|460800|921600|1000000)
  safe_update: bool
  qemu_usb_reenumeration_workaround: bool
  allow_legacy_rcp: bool
  allow_prereleases: bool
  pinned_ncs_minor: str?
  dfu_serial_number: str?
  dfu_usb_path: str?
  manifest_poll_interval: int(300,86400)
  idle_window: int(10,300)
  boot_timeout: int(15,120)
